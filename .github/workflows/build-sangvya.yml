
name: Build Sangvya APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Sangvya ZIP
        run: |
          mkdir sangvya-src
          unzip -q Sangvya_Android_Project.zip -d sangvya-src
          test -f sangvya-src/app/build.gradle.kts
          test -f sangvya-src/settings.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: sangvya-src
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sangvya-debug-apk
          path: sangvya-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
